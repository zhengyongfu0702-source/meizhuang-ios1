name: build-ipa

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project MeizhuangNative.xcodeproj \
            -scheme MeizhuangNative \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 IPA
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/MeizhuangNative.app"
          test -d "$APP"
          rm -rf Payload MeizhuangNative.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr MeizhuangNative.ipa Payload
          ls -lh MeizhuangNative.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: MeizhuangNative-ipa
          path: MeizhuangNative.ipa
          retention-days: 30
