name: MeizhuangNative
options:
  bundleIdPrefix: top.jn736918
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  MeizhuangNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: top.jn736918.meizhuang
        PRODUCT_NAME: MeizhuangNative
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ENABLE_BITCODE: "NO"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 回收统计
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        NSCameraUsageDescription: 用于扫描快递单条码，快速核对运单
        NSPhotoLibraryUsageDescription: 用于从相册选择快递单照片识别单号
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

# 显式声明 scheme：不写这段，xcodegen 不产出 shared scheme，
# CI 里 xcodebuild -scheme 有概率直接报 "does not contain a scheme named"
schemes:
  MeizhuangNative:
    build:
      targets:
        MeizhuangNative: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
